// Grove Protocol Definition
// This file defines the gRPC protocol used by Grove extension host
// for communication with Mountain and other services


syntax = "proto3";


package Grove;


import "google/protobuf/empty.proto";


// ===================================================================
// Grove Service
// Service definition for Grove extension host operations
// ===================================================================

service GroveService {
  // Extension lifecycle
  rpc LoadExtension(LoadExtensionRequest) returns (LoadExtensionResponse);

  rpc UnloadExtension(UnloadExtensionRequest) returns (google.protobuf.Empty);


  // Activation
  rpc ActivateExtension(ActivationRequest) returns (ActivationResponse);

  rpc DeactivateExtension(DeactivationRequest) returns (google.protobuf.Empty);


  // Extension queries
  rpc GetExtensionStatus(ExtensionStatusRequest) returns (ExtensionStatusResponse);

  rpc ListExtensions(ListExtensionsRequest) returns (ListExtensionsResponse);


  // API calls from extension to host
  rpc ExtensionApiCall(ApiCallRequest) returns (ApiCallResponse);


  // Configuration
  rpc GetConfiguration(ConfigurationRequest) returns (ConfigurationResponse);

  rpc UpdateConfiguration(UpdateConfigurationRequest) returns (google.protobuf.Empty);


  // WASM operations
  rpc LoadWASMModule(WASMModuleRequest) returns (WASMModuleResponse);

  rpc UnloadWASMModule(WASMModuleRequest) returns (google.protobuf.Empty);


  // Health check
  rpc HealthCheck(google.protobuf.Empty) returns (HealthCheckResponse);
}

// ===================================================================
// Extension Types
// Types for extension identification and management
// ===================================================================

message ExtensionIdentifier {
  // Extension identifier (e.g., "publisher.extension-name")
  string Id = 1;

  // Extension version (e.g., "1.0.0")
  string Version = 2;
}

message ExtensionMetadata {
  ExtensionIdentifier Identifier = 1;

  string DisplayName = 2;

  string Description = 3;

  repeated string ActivationEvents = 4;

  // Extension contributions
  repeated string Contributes = 5;

  // Requires VS Code engine
  bool EnginesVscode = 6;

  // Minimum VS Code version required
  string MinVscodeVersion = 7;

  // Extension capabilities
  map<string, string> Capabilities = 8;
}

message ExtensionManifest {
  ExtensionMetadata Metadata = 1;

  // Main entry point file
  string EntryPoint = 2;

  // Default configuration
  map<string, string> Configuration = 3;

  // Extension binary data (WASM or native)
  bytes BinaryData = 4;
}

// ===================================================================
// Load/Unload Extension
// Extension loading and unloading operations
// ===================================================================

message LoadExtensionRequest {
  ExtensionManifest Manifest = 1;

  // "wasm", "native", "ipc"
  string Transport = 2;

  // Load lazily on activation
  bool Lazy = 3;
}

message LoadExtensionResponse {
  bool Success = 1;

  string Message = 2;

  ExtensionIdentifier ExtensionId = 3;
}

message UnloadExtensionRequest {
  ExtensionIdentifier ExtensionId = 1;
}

// ===================================================================
// Activation/Deactivation
// Extension activation and deactivation operations
// ===================================================================

message ActivationContext {
  // Workspace root path
  string WorkspacePath = 1;

  // Environment variables
  map<string, string> Environment = 2;

  // Startup options (JSON)
  bytes StartupOptions = 3;

  // Already activated extensions
  repeated string ActivatedExtensions = 4;
}

message ActivationRequest {
  ExtensionIdentifier ExtensionId = 1;

  repeated string ActivationEvents = 2;

  ActivationContext Context = 3;
}

message ActivationResponse {
  bool Activated = 1;

  string Message = 2;

  // Time taken to activate in milliseconds
  int64 ActivationTimeMs = 3;

  // API events subscribed to
  repeated string APISubscriptions = 4;
}

message DeactivationRequest {
  ExtensionIdentifier ExtensionId = 1;
}

// ===================================================================
// Extension Status
// Query extension status
// ===================================================================

message ExtensionStatusRequest {
  ExtensionIdentifier ExtensionId = 1;
}

message ExtensionStatus {
  enum State {
    UNKNOWN = 0;

    LOADED = 1;

    ACTIVATED = 2;

    DEACTIVATED = 3;

    ERROR = 4;

  }

  State CurrentState = 1;

  // Error message if in ERROR state
  string ErrorMessage = 2;

  // Time since activation
  int64 ActivationTimeMs = 3;

  // Transport method used
  string Transport = 4;
}

message ExtensionStatusResponse {
  ExtensionStatus Status = 1;

  // Extension metadata
  ExtensionMetadata Metadata = 2;
}

message ListExtensionsRequest {
  // Empty - no specific filtering for now
}

message ListExtensionsResponse {
  repeated ExtensionManifest Extensions = 1;

  repeated ExtensionStatus Statuses = 2;
}

// ===================================================================
// API Calls
// Extension-to-host API calls
// ===================================================================

message ApiCallRequest {
  ExtensionIdentifier ExtensionId = 1;

  // API method being called
  string APIMethod = 2;

  // Method arguments (JSON or binary)
  bytes Arguments = 3;

  // Correlation ID for async calls
  string CorrelationId = 4;
}

message ApiCallResponse {
  bool Success = 1;

  // Response data (JSON or binary)
  bytes ResponseData = 2;

  // Error message if failed
  string ErrorMessage = 3;

  // Echoes the request correlation ID
  string CorrelationId = 4;
}

// ===================================================================
// Configuration
// Extension configuration management
// ===================================================================

message ConfigurationRequest {
  ExtensionIdentifier ExtensionId = 1;

  // Configuration keys to retrieve (empty = all)
  repeated string Keys = 2;
}

message ConfigurationResponse {
  map<string, string> Configuration = 1;
}

message UpdateConfigurationRequest {
  ExtensionIdentifier ExtensionId = 1;

  map<string, string> Configuration = 2;

  // True to merge, false to replace
  bool Merge = 3;
}

// ===================================================================
// WASM Operations
// WebAssembly-specific operations
// ===================================================================

message WASMModuleRequest {
  ExtensionIdentifier ExtensionId = 1;

  // WASM binary data
  bytes WASMBytes = 2;

  // Memory limit in MB
  uint64 MemoryLimitMb = 3;

  // Enable WASI support
  bool EnableWASI = 4;

  // Max execution time limit
  uint64 MaxExecutionTimeMs = 5;
}

message WASMModuleResponse {
  bool Loaded = 1;

  // Unique module identifier
  string ModuleId = 2;

  // Memory footprint
  uint64 MemoryUsedMb = 3;

  // Exported functions list
  repeated string ExportedFunctions = 4;

  // Error message if failed
  string ErrorMessage = 5;
}

// ===================================================================
// Health Check
// Health check for monitoring
// ===================================================================

message HealthCheckResponse {
  bool Healthy = 1;

  // Grove version
  string Version = 2;

  string StatusMessage = 3;

  // Number of loaded extensions
  int32 ExtensionsLoaded = 4;

  // Number of active extensions
  int32 ExtensionsActive = 5;

  // Uptime in seconds
  uint64 UptimeSeconds = 6;
}

// ===================================================================
// Events
// Server-sent events for extension communication
// ===================================================================

message ExtensionEvent {
  enum EventType {
    ACTIVATED = 0;

    DEACTIVATED = 1;

    ERROR = 2;

    API_CALL = 3;

    CONFIGURATION_CHANGED = 4;

  }

  EventType Kind = 1;

  ExtensionIdentifier ExtensionId = 2;

  // Event data (JSON)
  bytes EventData = 3;

  // Event timestamp
  int64 TimestampMs = 4;

  string CorrelationId = 5;
}

// GroveEventStream - streaming endpoint for extension events
service GroveEventStream {
  rpc SubscribeEvents(SubscribeRequest) returns (stream ExtensionEvent);
}

message SubscribeRequest {
  // Specific extensions (empty = all)
  repeated ExtensionIdentifier Extensions = 1;

  // Event types to subscribe to
  repeated string EventTypes = 2;
}
