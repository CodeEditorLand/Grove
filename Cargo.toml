[package]
name = "Grove"
version = "0.1.0"
edition = "2021"
authors = ["Grove Contributors"]
description = "Rust/WASM Extension Host for VS Code extensions"
license = "MIT"
repository = "https://github.com/CodeEditorLand/Element/Grove"
keywords = ["vscode", "extension", "wasm", "rust", "host"]
categories = ["development-tools", "wasm"]

[lib]
name = "Grove"
path = "Source/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "Grove"
path = "Source/main.rs"

[dependencies]
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["codec"] }
wasmtime = { version = "44", features = [
	"async",
	"component-model",
	"runtime",
	"cranelift",
], optional = true }
wasmtime-wasi = { version = "44", optional = true }
wasmparser = { version = "0.247", optional = true }
prost = { version = "0.14", optional = true }
tonic = { version = "0.14", optional = true }
tonic-build = "0.14"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_bytes = "0.11"
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
clap = { workspace = true, features = ["derive"] }
bytes = { workspace = true, features = ["serde"] }
futures = { workspace = true }
async-trait = { workspace = true }
semver = "1"
chrono = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
shellexpand = "3.1"
reqwest = { version = "0.13", features = ["json"], optional = true }
base64 = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { version = "0.18", optional = true }
opentelemetry = { workspace = true, default-features = false, features = [
	"trace",
], optional = true }
opentelemetry-otlp = { version = "0.31", features = [
	"grpc-tonic",
], optional = true }
opentelemetry-semantic-conventions = { version = "0.31", optional = true }
tracing-opentelemetry = { version = "0.32", optional = true }

[build-dependencies]
tonic-build = "0.14"
anyhow = { workspace = true }
vergen = { version = "9", features = ["build", "cargo", "rustc"] }

[features]
default = ["grpc", "wasm"]
grpc = ["tonic", "prost"]
wasm = ["wasmtime", "wasmtime-wasi", "reqwest", "wasmparser"]
telemetry = [
	"opentelemetry",
	"opentelemetry-otlp",
	"opentelemetry-semantic-conventions",
	"tracing-opentelemetry",
	"metrics-exporter-prometheus",
]
dev = ["telemetry"]
debug = ["dev"]
all = ["grpc", "wasm", "telemetry"]
