[package]
name = "grove"
version = "0.1.0"
edition = "2021"
authors = ["Grove Contributors"]
description = "Rust/WASM Extension Host for VS Code extensions"
license = "MIT"
repository = "https://github.com/CodeEditorLand/Element/Grove"
keywords = ["vscode", "extension", "wasm", "rust", "host"]
categories = ["development-tools", "wasm"]

[lib]
name = "grove"
path = "Source/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "grove"
path = "Source/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# WASM runtime
wasmtime = { version = "20", features = ["async", "component-model", "runtime", "cranelift"], optional = true }
wasmtime-wasi = { version = "20", optional = true }
wasmparser = { version = "0.218", optional = true }

# gRPC
prost = { version = "0.12", optional = true }
tonic = { version = "0.11", features = ["tls"], optional = true }
tonic-build = "0.11"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# tracing/logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.4", features = ["derive"] }

# Utilities
bytes = { version = "1.5", features = ["serde"] }
futures = "0.3"
async-trait = "0.1"
semver = "1"
chrono = "0.4"

# Additional missing dependencies
uuid = { version = "1.8", features = ["v4", "serde"] }
shellexpand = "3.1"
reqwest = { version = "0.11", features = ["json"], optional = true }
base64 = "0.22"

# Metrics
metrics = "0.23"
metrics-exporter-prometheus = { version = "0.13", optional = true }

# OTEL Tracing
opentelemetry = { version = "0.23", default-features = false, features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.16", features = ["grpc-tonic"], optional = true }
opentelemetry-semantic-conventions = { version = "0.15", optional = true }
tracing-opentelemetry = { version = "0.24", optional = true }

# IPC (for macOS/Linux)
[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", optional = true }

# Protocol buffers (build-only)
[build-dependencies]
tonic-build = "0.11"
anyhow = "1.0"
vergen = { version = "8.3", features = ["build", "cargo", "git", "gitcl", "rustc", "si"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
strip = "debuginfo"

[features]
default = ["grpc", "wasm"]
grpc = ["tonic", "prost"]
wasm = ["wasmtime", "wasmtime-wasi", "reqwest", "wasmparser"]
ipc = ["nix"]
telemetry = ["opentelemetry", "opentelemetry-otlp", "opentelemetry-semantic-conventions", "tracing-opentelemetry", "metrics-exporter-prometheus"]
dev = ["telemetry"]
debug = ["dev"]
all = ["grpc", "wasm", "ipc", "telemetry"]
