[package]
name = "grove"
version = "0.1.0"
edition = "2021"
authors = ["Grove Contributors"]
description = "Rust/WASM Extension Host for VS Code extensions"
license = "MIT"
repository = "https://github.com/CodeEditorLand/Element/Grove"
keywords = ["vscode", "extension", "wasm", "rust", "host"]
categories = ["development-tools", "wasm"]

[lib]
name = "grove"
path = "Source/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "grove"
path = "Source/main.rs"

[dependencies]
tokio = { version = "1.49", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
wasmtime = { version = "42", features = [
	"async",
	"component-model",
	"runtime",
	"cranelift",
], optional = true }
wasmtime-wasi = { version = "42", optional = true }
wasmparser = { version = "0.245", optional = true }
prost = { version = "0.12", optional = true }
tonic = { version = "0.12", optional = true }
tonic-build = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.5", features = ["derive"] }
bytes = { version = "1.11", features = ["serde"] }
futures = "0.3"
async-trait = "0.1"
semver = "1"
chrono = "0.4"
uuid = { version = "1.21", features = ["v4", "serde"] }
shellexpand = "3.1"
reqwest = { version = "0.13", features = ["json"], optional = true }
base64 = "0.22"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", optional = true }
opentelemetry = { version = "0.31", default-features = false, features = [
	"trace",
], optional = true }
opentelemetry-otlp = { version = "0.31", features = [
	"grpc-tonic",
], optional = true }
opentelemetry-semantic-conventions = { version = "0.31", optional = true }
tracing-opentelemetry = { version = "0.32", optional = true }

[build-dependencies]
tonic-build = "0.12"
anyhow = "1.0"
vergen = { version = "8", features = ["build", "cargo", "rustc"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
strip = "debuginfo"

[features]
default = ["grpc", "wasm"]
grpc = ["tonic", "prost"]
wasm = ["wasmtime", "wasmtime-wasi", "reqwest", "wasmparser"]
telemetry = [
	"opentelemetry",
	"opentelemetry-otlp",
	"opentelemetry-semantic-conventions",
	"tracing-opentelemetry",
	"metrics-exporter-prometheus",
]
dev = ["telemetry"]
debug = ["dev"]
all = ["grpc", "wasm", "telemetry"]
