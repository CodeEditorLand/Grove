[package]
authors = ["Source 🖋️ Open 👐🏻 <Source/Open@Editor.Land>"]
autobenches = false
autobins = false
autoexamples = false
autotests = false
description = "Grove 🌿"
edition = "2024"
license-file = "LICENSE"
name = "Grove"
publish = false
version = "0.1.0"

[lib]
name = "Grove"
path = "Source/Library.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "Grove"
path = "Source/main.rs"

[dependencies]
Common = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["codec"] }
wasmtime = { version = "45", features = [
	"async",
	"component-model",
	"runtime",
	"cranelift",
], optional = true }
wasmtime-wasi = { version = "45", optional = true }
wasmparser = { version = "0.250", optional = true }
prost = { version = "0.14", optional = true }
tonic = { version = "0.14", optional = true }
tonic-build = "0.14"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_bytes = "0.11"
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
clap = { workspace = true, features = ["derive"] }
bytes = { workspace = true, features = ["serde"] }
futures = { workspace = true }
async-trait = { workspace = true }
semver = "1"
chrono = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
shellexpand = "3.1"
reqwest = { version = "0.13", features = ["json"], optional = true }
base64 = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { version = "0.18", optional = true }
opentelemetry = { workspace = true, default-features = false, features = [
	"trace",
], optional = true }
opentelemetry-otlp = { version = "0.32", features = [
	"grpc-tonic",
], optional = true }
opentelemetry-semantic-conventions = { version = "0.32", optional = true }
tracing-opentelemetry = { version = "0.33", optional = true }

[build-dependencies]
# tonic 0.14 split proto-compilation into the `tonic-prost-build` crate.
# `tonic-build` now only ships manual codegen + `CodeGenBuilder`; the
# `configure()` / `compile_protos()` flow the build script needs lives in
# `tonic-prost-build`. Both are pinned to the same 0.14.x workspace version
# so tonic / prost / tonic-prost stay in lockstep.
tonic-build = "0.14"
tonic-prost-build = "0.14"
anyhow = { workspace = true }
vergen = { version = "9", features = ["build", "cargo", "rustc"] }

Mist = { workspace = true, optional = true }

[features]
default = ["grpc", "wasm"]
grpc = ["tonic", "prost"]
wasm = ["wasmtime", "wasmtime-wasi", "reqwest", "wasmparser"]
websocket = ["Mist"]
telemetry = [
	"opentelemetry",
	"opentelemetry-otlp",
	"opentelemetry-semantic-conventions",
	"tracing-opentelemetry",
	"metrics-exporter-prometheus",
]
dev = ["telemetry"]
debug = ["dev"]
all = ["grpc", "wasm", "telemetry"]
